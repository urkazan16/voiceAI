name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (js)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:js

  lint:
    name: lint (rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: lint-${{ matrix.os }}
      - run: npm ci
      - run: npm run check:rust

  test:
    name: test
    runs-on: ${{ matrix.os }}
    needs: [quality, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: test-${{ matrix.os }}
      - run: npm ci
      - run: npm run test:all

  license:
    name: license
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: npm ci
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run license:check
      - run: npm run uniqueness:check

  security:
    name: security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  build:
    name: build
    runs-on: ${{ matrix.os }}
    needs: [quality, lint, test, license]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel .app is cross-compiled on Apple silicon. macos-15-intel is
          # several times slower and dominated billed minutes.
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x64
            cmake_osx_arch: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            cmake_osx_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: build-${{ matrix.name }}
      - run: npm ci
      - run: npm run build:ui
      - run: bash scripts/run-with-toolchain.sh cargo build --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
        env:
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}

  # Installers are uploaded as run artifacts. Skip on pull_request (including
  # Dependabot): those runs only compile. Tag a v* release or push main / Run workflow.
  package:
    name: package
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    # Secrets live in the APPLE_CERTIFICATE environment, not repository secrets.
    environment: APPLE_CERTIFICATE
    runs-on: ${{ matrix.os }}
    needs: [build, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: LocalFlow-macos-x64
            cargo_target: x86_64-apple-darwin
            cmake_osx_arch: x86_64
          - os: macos-14
            artifact: LocalFlow-macos-arm64
            cargo_target: aarch64-apple-darwin
            cmake_osx_arch: arm64
          - os: windows-latest
            artifact: LocalFlow-windows-x64
            cargo_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact: LocalFlow-linux-x64
            cargo_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Require Apple signing and notarization secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "macOS .dmg files are blocked by Gatekeeper unless they are Developer ID signed and notarized."
            echo "Add these GitHub Actions secrets: ${missing[*]}"
            echo "See README.md (Download section)."
            exit 1
          fi
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y file libfuse2
      - if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.cargo_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: package-${{ matrix.artifact }}
      - run: npm ci
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-macos-import-cert.sh
      - run: npm run build:release
        env:
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-artifacts/LocalFlow-*.dmg
            release-artifacts/LocalFlow-*.exe
            release-artifacts/LocalFlow-*.deb
            release-artifacts/LocalFlow-*.AppImage
            release-artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: LocalFlow-*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( \
            -name 'LocalFlow-*.dmg' -o \
            -name 'LocalFlow-*.exe' -o \
            -name 'LocalFlow-*.deb' -o \
            -name 'LocalFlow-*.AppImage' \
          \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer files downloaded"
            find dist -type f || true
            exit 1
          fi
          find dist -name SHA256SUMS -exec cat {} \; | grep -E '  LocalFlow-' | sort -u > SHA256SUMS
          files+=(SHA256SUMS)
          notes=$'Installers for macOS, Windows, and Linux.\nУстановщики для macOS, Windows и Linux.\n\nSpeech models download on first launch (~1.5 GB).\nРечевая модель скачивается при первом запуске (~1.5 ГБ).\n\nmacOS builds are Developer ID signed and notarized. If an older download still shows Apple could not verify LocalFlow, replace it with this .dmg, then enable Accessibility and Microphone.\n\nСборки macOS подписаны Developer ID и нотаризованы. Если старый файл всё ещё блокирует Gatekeeper, скачайте этот .dmg заново, затем включите Универсальный доступ и Микрофон.'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release create "$tag" "${files[@]}" --title "LocalFlow ${tag}" --notes "$notes" --latest
            fi
          else
            if gh release view nightly >/dev/null 2>&1; then
              gh release delete nightly --yes --cleanup-tag
            fi
            gh release create nightly "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "LocalFlow" \
              --notes "$notes" \
              --latest
          fi
