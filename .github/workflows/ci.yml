name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      opus_package_smoke:
        description: Build and runtime-test experimental Opus installers without publishing them
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (js)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:js

  lint:
    name: lint (rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: lint-${{ matrix.os }}
      - run: npm ci
      - run: npm run check:rust

  test:
    name: test
    runs-on: ${{ matrix.os }}
    needs: [quality, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: test-${{ matrix.os }}
      - run: npm ci
      - run: npm run test:all

  opus-prototype:
    name: opus prototype (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: opus-${{ matrix.os }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features audio-symphonia-opus --lib symphonia_opus
      - name: Decode fixture with the bundled runtime
        run: cargo run --manifest-path src-tauri/Cargo.toml --locked --features audio-symphonia-opus --example opus_decode_bench -- tests/fixtures/ogg_opus/mono-997hz-1s.opus
      - name: Verify no dynamic libopus dependency (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dependencies="$(ldd src-tauri/target/debug/examples/opus_decode_bench)"
          printf '%s\n' "$dependencies"
          ! grep -Eiq 'libopus[^/]*\.so' <<<"$dependencies"
      - name: Verify no dynamic libopus dependency (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dependencies="$(otool -L src-tauri/target/debug/examples/opus_decode_bench)"
          printf '%s\n' "$dependencies"
          ! grep -Eiq 'libopus[^/]*\.dylib' <<<"$dependencies"
      - name: Verify no dynamic libopus dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dependencies = & 'C:\Program Files\LLVM\bin\llvm-objdump.exe' -p src-tauri/target/debug/examples/opus_decode_bench.exe
          $dependencies
          if ($dependencies -match '(?i)libopus[^\s]*\.dll') {
            throw 'Experimental decoder unexpectedly depends on a libopus DLL'
          }

  license:
    name: license
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: npm ci
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run license:check
      - run: npm run uniqueness:check

  security:
    name: security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  build:
    name: build
    runs-on: ${{ matrix.os }}
    needs: [quality, lint, test, license]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel .app is cross-compiled on Apple silicon. macos-15-intel is
          # several times slower and dominated billed minutes.
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x64
            cmake_osx_arch: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            cmake_osx_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: build-${{ matrix.name }}
      - run: npm ci
      - run: npm run build:ui
      - run: bash scripts/run-with-toolchain.sh cargo build --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
        env:
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}
      - name: Compile experimental Ogg/Opus backend
        run: bash scripts/run-with-toolchain.sh cargo build --manifest-path src-tauri/Cargo.toml --locked --features audio-symphonia-opus --target ${{ matrix.target }}
        env:
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}

  # Manual and intentionally non-publishing: this builds each real installer,
  # executes the packaged decoder, and then lets the runner discard the files.
  opus-package-smoke:
    name: opus package smoke (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' && inputs.opus_package_smoke
    environment: APPLE_CERTIFICATE
    runs-on: ${{ matrix.os }}
    needs: [build, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-x64
            cargo_target: x86_64-apple-darwin
            cmake_osx_arch: x86_64
          - os: macos-14
            name: macos-arm64
            cargo_target: aarch64-apple-darwin
            cmake_osx_arch: arm64
          - os: windows-latest
            name: windows-x64
            cargo_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            name: linux-x64
            cargo_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple signing and notarization secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Experimental macOS package smoke requires signing and notarization: ${missing[*]}"
            exit 1
          fi
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y file libfuse2 squashfs-tools
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.cargo_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: opus-package-${{ matrix.name }}
      - run: npm ci
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-macos-import-cert.sh
      - name: Build the default package baseline
        run: npm run build:release
        env:
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Record the default package sizes
        run: node scripts/measure-opus-package-delta.mjs snapshot default .release-measure/default.json
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
      - name: Build and runtime-test the experimental package
        run: npm run build:release
        env:
          LOCALFLOW_AUDIO_SYMPHONIA_OPUS: "1"
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Compare default and experimental release artifacts
        run: |
          node scripts/measure-opus-package-delta.mjs snapshot audio-symphonia-opus .release-measure/opus.json
          node scripts/measure-opus-package-delta.mjs compare .release-measure/default.json .release-measure/opus.json release-artifacts/OPUS_PACKAGE_DELTA
        env:
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
      - name: Verify packaged executable has no dynamic libopus (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable="src-tauri/target/${{ matrix.cargo_target }}/release/bundle/macos/LocalFlow.app/Contents/MacOS/localflow"
          dependencies="$(otool -L "$executable")"
          printf '%s\n' "$dependencies"
          ! grep -Eiq 'libopus[^/]*\.dylib' <<<"$dependencies"
      - name: Verify packaged executable has no dynamic libopus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          executable="src-tauri/target/${{ matrix.cargo_target }}/release/localflow"
          dependencies="$(ldd "$executable")"
          printf '%s\n' "$dependencies"
          ! grep -Eiq 'libopus[^/]*\.so' <<<"$dependencies"
      - name: Verify packaged executable has no dynamic libopus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = 'src-tauri/target/${{ matrix.cargo_target }}/release/localflow.exe'
          $dependencies = & 'C:\Program Files\LLVM\bin\llvm-objdump.exe' -p $executable
          $dependencies
          if ($dependencies -match '(?i)libopus[^\s]*\.dll') {
            throw 'Packaged experimental decoder unexpectedly depends on a libopus DLL'
          }
      - name: Retain package measurements (installers are intentionally excluded)
        uses: actions/upload-artifact@v4
        with:
          name: opus-measurement-${{ matrix.name }}
          path: |
            .release-measure/default.json
            .release-measure/opus.json
            release-artifacts/OPUS_PACKAGE_DELTA.json
            release-artifacts/OPUS_PACKAGE_DELTA.md
            release-artifacts/opus-runtime-metrics.json
          if-no-files-found: error

  # Installers are uploaded as run artifacts. Skip on pull_request (including
  # Dependabot): those runs only compile. Tag a v* release or push main / Run workflow.
  package:
    name: package
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.opus_package_smoke) ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    # Secrets live in the APPLE_CERTIFICATE environment, not repository secrets.
    environment: APPLE_CERTIFICATE
    runs-on: ${{ matrix.os }}
    needs: [build, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: LocalFlow-macos-x64
            cargo_target: x86_64-apple-darwin
            cmake_osx_arch: x86_64
          - os: macos-14
            artifact: LocalFlow-macos-arm64
            cargo_target: aarch64-apple-darwin
            cmake_osx_arch: arm64
          - os: windows-latest
            artifact: LocalFlow-windows-x64
            cargo_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact: LocalFlow-linux-x64
            cargo_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple signing and notarization secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "macOS .dmg files are blocked by Gatekeeper unless they are Developer ID signed and notarized."
            echo "Add these GitHub Actions secrets: ${missing[*]}"
            echo "See README.md (Download section)."
            exit 1
          fi
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y file libfuse2 squashfs-tools
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\lib' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.cargo_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: package-${{ matrix.artifact }}
      - run: npm ci
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-macos-import-cert.sh
      - run: npm run build:release
        env:
          LOCALFLOW_GIT_SHA: ${{ github.sha }}
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Validate AppImage catalog requirements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find release-artifacts -maxdepth 1 -type f -name 'LocalFlow-*.AppImage')
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}"
            exit 1
          fi
          if [[ "$(basename "${appimages[0]}")" =~ [Ll]inux ]]; then
            echo "AppImage filename must not contain 'linux'"
            exit 1
          fi
          appimage="$(realpath "${appimages[0]}")"
          bash scripts/validate-appimage.sh "$appimage"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-artifacts/LocalFlow-*.dmg
            release-artifacts/LocalFlow-*.exe
            release-artifacts/LocalFlow-*.deb
            release-artifacts/LocalFlow-*.AppImage
            release-artifacts/SHA256SUMS
            release-artifacts/NOTICE
            release-artifacts/THIRD_PARTY_LICENSES/
            release-artifacts/sbom.cdx.json
            release-artifacts/CHANGELOG.md
          if-no-files-found: error

  publish:
    name: publish
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.opus_package_smoke) ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: LocalFlow-*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( \
            -name 'LocalFlow-*.dmg' -o \
            -name 'LocalFlow-*.exe' -o \
            -name 'LocalFlow-*.deb' -o \
            -name 'LocalFlow-*.AppImage' \
          \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer files downloaded"
            find dist -type f || true
            exit 1
          fi
          find dist -name SHA256SUMS -exec cat {} \; | grep -E '  LocalFlow-' | sort -u > SHA256SUMS
          files+=(SHA256SUMS)
          notes=$'Installers for macOS, Windows, and Linux.\nУстановщики для macOS, Windows и Linux.\n\nSpeech and formatting models download on first launch (Whisper Medium Q8_0 ~820 MB, Qwen3 4B ~2.5 GB).\nМодели скачиваются при первом запуске (Whisper Medium Q8_0 ~820 МБ, Qwen3 4B ~2,5 ГБ).\n\nmacOS builds are Developer ID signed and notarized. If an older download still shows Apple could not verify LocalFlow, replace it with this .dmg, then enable Accessibility and Microphone.\n\nСборки macOS подписаны Developer ID и нотаризованы. Если старый файл всё ещё блокирует Gatekeeper, скачайте этот .dmg заново, затем включите Универсальный доступ и Микрофон.'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release create "$tag" "${files[@]}" --title "LocalFlow ${tag}" --notes "$notes" --latest
            fi
          else
            if gh release view nightly >/dev/null 2>&1; then
              gh release delete nightly --yes --cleanup-tag
            fi
            gh release create nightly "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "LocalFlow" \
              --notes "$notes" \
              --latest
          fi
