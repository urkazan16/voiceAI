name: Linux build dependencies
description: >-
  System packages LocalFlow needs on Linux: webkit2gtk for the Tauri webview,
  ayatana appindicator for the tray, ALSA headers for cpal capture, and cmake
  plus clang for whisper.cpp.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential \
          cmake \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libclang-dev \
          llvm-dev \
          patchelf
        libdir="$(llvm-config --libdir 2>/dev/null || true)"
        if [[ -n "$libdir" ]]; then
          echo "LIBCLANG_PATH=$libdir" >> "$GITHUB_ENV"
        fi
