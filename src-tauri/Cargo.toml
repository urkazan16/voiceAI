[package]
name = "localflow"
version = "0.1.0"
description = "LocalFlow desktop core — local-first voice pipeline"
authors = ["LocalFlow Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "localflow"

[lib]
name = "localflow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "localflow"
path = "src/main.rs"

[[test]]
name = "integration"
path = "../tests/integration/pipeline_integration.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"

[[test]]
name = "performance"
path = "../tests/performance/latency.rs"

[[test]]
name = "tray"
path = "tests/tray.rs"

[features]
default = []
ai-bench = []

[build-dependencies]
cc = "1.2.13"
tauri-build = { version = "2.0.6", features = [] }
bzip2 = "0.4.4"
tar = "0.4.46"

[dependencies]
tauri = { version = "2.2.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
sha2 = "0.10.8"
hex = "0.4.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1.12.1", features = ["v4"] }
chrono = { version = "0.4.39", features = ["serde", "clock"] }
cpal = "0.15.3"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3.31"
regex = "1.11.1"
libc = "0.2"
whisper-rs = { version = "0.16.0", default-features = false }
num_cpus = "1.16"

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }

# Metal is for Apple Silicon. whisper.cpp's Metal path hangs or fails on Intel
# GPUs (and when the x64 .dmg is cross-compiled on an arm64 runner). Intel
# builds use Accelerate on CPU instead.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16.0", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13.1", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSProcessInfo",
    "NSSet",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSPasteboard",
    "NSRunningApplication",
    "NSWorkspace",
] }

[dev-dependencies]
tempfile = "3.16.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Dictation and audio work run on background threads.  Keep panics unwindable
# so a recoverable worker failure cannot terminate the whole GUI (which is
# especially opaque in the console-less Windows release build).
panic = "unwind"
strip = "symbols"
